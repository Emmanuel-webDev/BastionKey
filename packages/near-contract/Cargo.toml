[package]
name = "bastionkey-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "BastionKey: on-chain policy engine that gates NEAR Chain Signatures for AI agents"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# "unstable" exposes env::ecrecover, needed to verify the NEAR AI Cloud TEE signature on chain
near-sdk = { version = "5", features = ["unstable"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
